<!DOCTYPE html>
<html>
<head>
    <script>
        // Serve mobile version for small screens, desktop version otherwise
        if (window.innerWidth <= 768) {
            document.documentElement.style.display = 'none';
            fetch('/home/mobile.html').then(function(res) { return res.text(); }).then(function(html) {
                document.open();
                document.write(html);
                document.close();
            });
        } else {
            document.documentElement.style.display = 'none';
            fetch('/home/index.html').then(function(res) { return res.text(); }).then(function(html) {
                document.open();
                document.write(html);
                document.close();
            });
        }
    </script>
    <!-- SEO Fallback (for crawlers that don't execute JS) -->
    <title>Owl Assist | AI Receptionist for Modern Businesses</title>
    <meta name="description" content="Owl Assist is an AI-powered receptionist that handles 24/7 customer inquiries, bookings, and support for modern businesses. Start your free trial today.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://owlassist.app/">
</head>
<body></body>
</html>
